name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: todoist
          POSTGRES_PASSWORD: todoist
          POSTGRES_DB: todoist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U todoist"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://todoist:todoist@localhost:5432/todoist_test
      BETTER_AUTH_SECRET: ci-placeholder-secret-32-chars-min
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Drizzle generate (verify schema consistency)
        run: pnpm db:generate

      - name: Run migrations on test DB
        run: pnpm db:migrate

      - name: Unit + integration tests
        run: pnpm test

      - name: Build
        run: pnpm build
